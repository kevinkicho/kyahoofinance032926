# Warm App Hosting market APIs after deploy.
# Default path is HTTP-only (no GCP secrets required) so the workflow always works.
# Optional traffic routing: set repo variable ENABLE_GCLOUD_TRAFFIC=true and secret GCP_SA_KEY.
#
# Run: Actions → "Post-deploy warm (App Hosting)" → Run workflow
# Or locally: npm run postdeploy:warm

name: Post-deploy warm (App Hosting)

on:
  workflow_dispatch:
    inputs:
      warm_only:
        description: "Skip Cloud Run traffic routing (warm APIs only)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Never compare secrets to '' in if: — GitHub rejects that and fails the run.
      # Use a public repo variable as the feature flag instead.
      - name: Auth gcloud
        if: ${{ vars.ENABLE_GCLOUD_TRAFFIC == 'true' && inputs.warm_only == false }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        if: ${{ vars.ENABLE_GCLOUD_TRAFFIC == 'true' && inputs.warm_only == false }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: kfinance032926

      - name: Warm hosted APIs
        env:
          SHOT_BASE_URL: ${{ vars.HOSTED_URL }}
          WARM_TOKEN: ${{ secrets.WARM_TOKEN }}
        run: |
          set -euo pipefail
          export SHOT_BASE_URL="${SHOT_BASE_URL:-https://kyahoofinance032926--kfinance032926.us-central1.hosted.app}"
          # Default: warm only. Traffic routing only when flag set and warm_only is false.
          if [ "${{ inputs.warm_only }}" = "true" ] || [ "${{ vars.ENABLE_GCLOUD_TRAFFIC }}" != "true" ]; then
            export WARM_ONLY=1
            echo "Mode: WARM_ONLY (HTTP warm of priority /api/* routes)"
          else
            echo "Mode: traffic routing + warm"
          fi
          node scripts/post-deploy-warm.mjs
