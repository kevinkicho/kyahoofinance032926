# Firebase App Hosting — build/runtime env for kyahoofinance032926 backend.
# Secrets were created with: firebase apphosting:secrets:set <NAME> --force
# and granted to backend kyahoofinance032926.
#
# Client Firebase web config is public by design; values are still injected
# via Secret Manager so builds stay consistent across environments.

runConfig:
  runtime: nodejs24

env:
  - variable: VITE_FIREBASE_API_KEY
    secret: VITE_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    secret: VITE_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_DATABASE_URL
    secret: VITE_FIREBASE_DATABASE_URL
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_PROJECT_ID
    secret: VITE_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_STORAGE_BUCKET
    secret: VITE_FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    secret: VITE_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_APP_ID
    secret: VITE_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME
