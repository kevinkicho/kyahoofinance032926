# Firebase App Hosting — kyahoofinance032926
# https://firebase.google.com/docs/app-hosting/configure
#
# Production must run the Express API (which also serves Vite dist/), NOT
# scripts/start.js (that boots Vite dev + dual ports and fails Cloud Run's
# PORT=8080 health check).

# Keep enough of the repo for server + built SPA.
outputFiles:
  serverApp:
    include:
      - .

scripts:
  # Buildpacks run `npm ci` with NODE_ENV=production first (no devDeps).
  # Re-install with --include=dev so vite (devDependency) is available for
  # `npm run build`, then produce dist/ for the Express static server.
  buildCommand: npm ci --include=dev --legacy-peer-deps && npm run build
  # Single process on $PORT (Cloud Run injects 8080).
  runCommand: node server/index.js

runConfig:
  runtime: nodejs24
  # Dashboard cold-start loads many routes; give the container room.
  # minInstances: 1 keeps one warm container so ephemeral disk cache survives
  # between visitors (minInstances: 0 wiped cache and left panels hollow).
  # maxInstances kept low: each instance has its own disk cache; high fan-out
  # leaves some replicas serving hollow partials while others hold full data.
  cpu: 1
  memoryMiB: 1024
  maxInstances: 2
  minInstances: 1
  concurrency: 80

env:
  # Only force production at runtime so build can install vite etc.
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME

  - variable: VITE_FIREBASE_API_KEY
    secret: VITE_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    secret: VITE_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_DATABASE_URL
    secret: VITE_FIREBASE_DATABASE_URL
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_PROJECT_ID
    secret: VITE_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_STORAGE_BUCKET
    secret: VITE_FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    secret: VITE_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_APP_ID
    secret: VITE_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME

  # Server-side market data keys (runtime only — never bake into client bundle).
  # Without these, panels fetch hollow payloads and splash shows mostly red.
  - variable: FRED_API_KEY
    secret: FRED_API_KEY
    availability:
      - RUNTIME
  - variable: EIA_API_KEY
    secret: EIA_API_KEY
    availability:
      - RUNTIME
  - variable: BLS_API_KEY
    secret: BLS_API_KEY
    availability:
      - RUNTIME
  - variable: BEA_API_KEY
    secret: BEA_API_KEY
    availability:
      - RUNTIME
  - variable: EDGAR_USER_AGENT
    secret: EDGAR_USER_AGENT
    availability:
      - RUNTIME
  - variable: FINNHUB_API_KEY
    secret: FINNHUB_API_KEY
    availability:
      - RUNTIME
  - variable: FIREBASE_DATABASE_URL
    secret: FIREBASE_DATABASE_URL
    availability:
      - RUNTIME
